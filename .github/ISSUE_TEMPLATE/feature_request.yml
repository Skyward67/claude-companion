name: Feature idea
description: Suggest something the buddy could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea for how it could work
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Related Claude Code docs, mockups, or similar tools.
