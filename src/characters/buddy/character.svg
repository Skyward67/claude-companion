<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" aria-label="Claude buddy">
  <defs>
    <radialGradient id="bodyGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" style="stop-color: var(--body-hi)"/>
      <stop offset="55%" style="stop-color: var(--body)"/>
      <stop offset="100%" style="stop-color: var(--body-lo)"/>
    </radialGradient>
    <radialGradient id="miniGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" style="stop-color: var(--belly)"/>
      <stop offset="100%" style="stop-color: var(--body)"/>
    </radialGradient>
    <!-- The laptop screen's light on its face while coding. -->
    <radialGradient id="glowGrad" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#8ff0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8ff0ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="termClip"><rect x="111" y="58" width="42" height="25"/></clipPath>
    <clipPath id="webClip"><rect x="111" y="57" width="42" height="28"/></clipPath>
  </defs>

  <ellipse class="shadow" cx="80" cy="147" rx="36" ry="6"/>

  <g class="wrap">
    <g class="body">
      <g class="arm arm-l"><ellipse cx="37" cy="104" rx="9" ry="13"/></g>
      <g class="arm arm-r"><ellipse cx="123" cy="104" rx="9" ry="13"/></g>
      <ellipse class="foot foot-l" cx="64" cy="139" rx="11" ry="6.5"/>
      <ellipse class="foot foot-r" cx="96" cy="139" rx="11" ry="6.5"/>

      <path class="blob" d="M80 52 C112 52 127 74 127 100 C127 126 107 140 80 140 C53 140 33 126 33 100 C33 74 48 52 80 52 Z"/>
      <ellipse class="belly" cx="80" cy="117" rx="27" ry="17"/>

      <g class="sprout">
        <path class="stem" d="M80 53 Q79 47 80 42"/>
        <path class="spark" d="M80 25 Q82.5 34 91 36.5 Q82.5 39 80 48 Q77.5 39 69 36.5 Q77.5 34 80 25 Z"/>
      </g>

      <g class="face">
        <g class="eyes">
          <g class="look">
            <g class="eye eye-l"><ellipse class="pupil" cx="64" cy="88" rx="7" ry="9"/><circle class="shine" cx="66.6" cy="84.4" r="2.6"/><circle class="shine sm" cx="62" cy="91.5" r="1.2"/></g>
            <g class="eye eye-r"><ellipse class="pupil" cx="96" cy="88" rx="7" ry="9"/><circle class="shine" cx="98.6" cy="84.4" r="2.6"/><circle class="shine sm" cx="94" cy="91.5" r="1.2"/></g>
          </g>
        </g>
        <g class="eyes-alt eyes-closed"><path d="M57 89 Q64 94 71 89"/><path d="M89 89 Q96 94 103 89"/></g>
        <g class="eyes-alt eyes-happy"><path d="M57 91 Q64 81 71 91"/><path d="M89 91 Q96 81 103 91"/></g>
        <g class="eyes-alt eyes-squeeze"><path d="M58 84 L69 89 L58 94"/><path d="M102 84 L91 89 L102 94"/></g>
        <g class="eyes-alt eyes-dizzy">
          <path d="M64 88 m-6 0 a6 6 0 1 1 6 6 a4 4 0 1 1 -4 -4 a2 2 0 1 1 2 2"/>
          <path d="M96 88 m-6 0 a6 6 0 1 1 6 6 a4 4 0 1 1 -4 -4 a2 2 0 1 1 2 2"/>
        </g>

        <ellipse class="blush" cx="51" cy="104" rx="8" ry="4.5"/>
        <ellipse class="blush" cx="109" cy="104" rx="8" ry="4.5"/>

        <path class="mouth m-smile" d="M72 104 Q80 111 88 104"/>
        <path class="mouth m-flat" d="M74 106 Q80 107.5 86 106"/>
        <ellipse class="mouth m-o" cx="80" cy="107" rx="4.2" ry="5.2"/>
        <path class="mouth m-grin" d="M70 102 Q80 117 90 102 Z"/>
        <path class="mouth m-wavy" d="M70 107 q2.5 -3 5 0 t5 0 t5 0 t5 0"/>
      </g>
    </g>

    <g class="props">
      <g class="prop p-read p-search">
        <circle cx="139" cy="93" r="9.5" class="lens"/>
        <circle cx="136" cy="90" r="3" class="glint"/>
        <path d="M146 100 L155 110" class="handle"/>
      </g>
      <g class="prop p-edit">
        <g transform="rotate(32 140 98)">
          <rect x="135" y="78" width="10" height="28" rx="2" class="pencil"/>
          <rect x="135" y="74" width="10" height="6" rx="2" class="eraser"/>
          <path d="M135 106 L140 116 L145 106 Z" class="wood"/>
          <path d="M138.5 113 L140 116 L141.5 113 Z" class="lead"/>
        </g>
      </g>
      <g class="prop p-run">
        <rect x="124" y="96" width="32" height="24" rx="4" class="term"/>
        <circle cx="129" cy="100.5" r="1.3" class="dot-r"/><circle cx="133" cy="100.5" r="1.3" class="dot-y"/><circle cx="137" cy="100.5" r="1.3" class="dot-g"/>
        <path d="M128 107 L132 110.5 L128 114" class="prompt"/>
        <rect x="134" y="112.5" width="7" height="2.2" class="cursor"/>
      </g>
      <g class="prop p-web">
        <circle cx="141" cy="96" r="11" class="globe"/>
        <ellipse cx="141" cy="96" rx="5" ry="11" class="meridian"/>
        <path d="M130 96 H152 M132 90 H150 M132 102 H150" class="meridian"/>
      </g>
      <g class="prop p-agent">
        <ellipse cx="146" cy="128" rx="11" ry="10" fill="url(#miniGrad)" class="mini"/>
        <circle cx="142.5" cy="127" r="1.7" class="mini-eye"/><circle cx="149.5" cy="127" r="1.7" class="mini-eye"/>
        <path d="M146 118 L146 114" class="mini-stem"/>
        <circle cx="146" cy="112.5" r="2" class="mini-spark"/>
      </g>
      <g class="prop p-plan p-ask">
        <rect x="128" y="88" width="24" height="30" rx="3" class="clip-board"/>
        <rect x="134" y="85" width="12" height="6" rx="2" class="clip"/>
        <path d="M132 98 l2 2 l4 -4 M141 99 H148 M132 106 l2 2 l4 -4 M141 107 H148 M133 113 H148" class="clip-lines"/>
      </g>
      <g class="prop p-tool">
        <circle cx="141" cy="98" r="9" class="gear"/>
        <circle cx="141" cy="98" r="3.5" class="gear-hole"/>
      </g>
    </g>

    <!-- Activities (do-*): what the buddy acts out while Claude works. -->
    <g class="acts">
      <!-- Typing and coding: a laptop seen from behind, paws on the keys. -->
      <ellipse class="act a-glow" cx="80" cy="98" rx="36" ry="27"/>
      <g class="act a-laptop">
        <path class="lap-base" d="M40 139 H120 L115 146 H45 Z"/>
        <rect class="lap-lid" x="50" y="112" width="60" height="29" rx="4"/>
        <path class="lap-logo" d="M80 119 Q81.5 124.5 86.5 126.5 Q81.5 128.5 80 134 Q78.5 128.5 73.5 126.5 Q78.5 124.5 80 119 Z"/>
        <ellipse class="paw paw-l" cx="65" cy="112" rx="7" ry="5.5"/>
        <ellipse class="paw paw-r" cx="95" cy="112" rx="7" ry="5.5"/>
      </g>

      <!-- Reading: an open book, a page turning now and then. -->
      <g class="act a-book">
        <path class="book-cover" d="M45 117 L80 121 L115 117 V142 L80 146 L45 142 Z"/>
        <path class="book-page" d="M48 115 Q64 112 79 118 V142 Q64 136 48 139 Z"/>
        <path class="book-page" d="M112 115 Q96 112 81 118 V142 Q96 136 112 139 Z"/>
        <path class="book-text" d="M53 121 Q63 119 74 123 M53 127 Q63 125 74 129 M53 133 Q61 131 69 134 M86 123 Q97 119 107 121 M86 129 Q97 125 107 127 M86 135 Q94 131 102 133"/>
        <path class="book-page book-flip" d="M81 118 Q96 112 112 115 V139 Q96 136 81 142 Z"/>
        <ellipse class="paw" cx="46" cy="129" rx="6.5" ry="5.5"/>
        <ellipse class="paw" cx="114" cy="129" rx="6.5" ry="5.5"/>
      </g>

      <!-- Searching: a big magnifier, swept from one eye to the other. -->
      <g class="act a-lens">
        <path class="lens-handle" d="M106 98 L117 111"/>
        <circle class="lens-big" cx="96" cy="88" r="13"/>
        <path class="lens-shine" d="M88 82 Q91 77.5 96 77"/>
        <ellipse class="paw" cx="118" cy="113" rx="6.5" ry="5.5"/>
      </g>

      <!-- Running a command: a terminal scrolling its output. -->
      <g class="act a-term">
        <rect class="tw" x="110" y="50" width="44" height="34" rx="4"/>
        <circle class="dot-r" cx="114.5" cy="54" r="1.3"/><circle class="dot-y" cx="118.5" cy="54" r="1.3"/><circle class="dot-g" cx="122.5" cy="54" r="1.3"/>
        <g clip-path="url(#termClip)">
          <g class="tw-lines">
            <path class="tw-out" d="M115 63 H131 M115 81 H131 M115 99 H131"/>
            <path class="tw-dim" d="M115 69 H146 M115 87 H146 M115 105 H146"/>
            <path class="tw-warn" d="M115 75 H124 M115 93 H124 M115 111 H124"/>
          </g>
        </g>
      </g>

      <!-- Browsing: a web page scrolling by. -->
      <g class="act a-web">
        <rect class="bw" x="110" y="48" width="44" height="38" rx="4"/>
        <path class="bw-bar" d="M110 57 V52 A4 4 0 0 1 114 48 H150 A4 4 0 0 1 154 52 V57 Z"/>
        <rect class="bw-url" x="119" y="50.5" width="31" height="4" rx="2"/>
        <circle class="bw-dot" cx="114.5" cy="52.5" r="1.5"/>
        <g clip-path="url(#webClip)">
          <g class="bw-page">
            <rect class="bw-hero" x="115" y="60" width="34" height="11" rx="2"/>
            <circle class="bw-globe" cx="132" cy="65.5" r="3.6"/>
            <path class="bw-text" d="M115 76 H148 M115 81 H139 M115 86 H145 M115 91 H132 M115 99 H148 M115 104 H136 M115 109 H146"/>
          </g>
        </g>
      </g>

      <!-- Planning: a clipboard, ticked off one line at a time. -->
      <g class="act a-clip" transform="translate(0 4)">
        <rect class="clip-board" x="56" y="110" width="48" height="34" rx="4"/>
        <rect class="clip" x="70" y="106.5" width="20" height="7" rx="2.5"/>
        <rect class="cb" x="61.5" y="117" width="7" height="7" rx="1.5"/>
        <rect class="cb" x="61.5" y="126" width="7" height="7" rx="1.5"/>
        <rect class="cb" x="61.5" y="135" width="7" height="7" rx="1.5"/>
        <path class="clip-lines" d="M73 120.5 H98 M73 129.5 H95 M73 138.5 H91"/>
        <path class="tick tick-1" d="M62.5 120 L65 123 L70.5 115.5"/>
        <path class="tick tick-2" d="M62.5 129 L65 132 L70.5 124.5"/>
        <path class="tick tick-3" d="M62.5 138 L65 141 L70.5 133.5"/>
        <ellipse class="paw" cx="56" cy="129" rx="6.5" ry="5.5"/>
        <ellipse class="paw" cx="104" cy="129" rx="6.5" ry="5.5"/>
      </g>
    </g>
  </g>

  <!-- Over the head while typing a reply, and code flying out while coding. -->
  <g class="act a-dots a-fx">
    <path class="tb" d="M109 20 H131 A11 11 0 0 1 131 42 H113 L102 50 L104.5 40 A11 11 0 0 1 109 20 Z"/>
    <circle class="tdot" cx="109" cy="31" r="3"/><circle class="tdot" cx="120" cy="31" r="3"/><circle class="tdot" cx="131" cy="31" r="3"/>
  </g>
  <g class="act a-code a-fx">
    <text class="glyph" x="116" y="62">&lt;/&gt;</text>
    <text class="glyph" x="132" y="46">{ }</text>
    <text class="glyph" x="20" y="64">;</text>
  </g>
  <text class="fx fx-huh" x="124" y="46">?</text>

  <g class="fx fx-thought">
    <circle cx="112" cy="40" r="3"/><circle cx="123" cy="29" r="4.5"/><circle cx="137" cy="17" r="6.5"/>
  </g>
  <g class="fx fx-zzz">
    <text x="108" y="44" class="z1">Z</text><text x="121" y="31" class="z2">z</text><text x="131" y="20" class="z3">z</text>
  </g>
  <g class="fx fx-sparkles">
    <path class="sp s1" d="M28 46 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2 Z"/>
    <path class="sp s2" d="M132 28 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 Z"/>
    <path class="sp s3" d="M18 96 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 Z"/>
    <path class="sp s4" d="M146 68 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2 Z"/>
  </g>
  <g class="fx fx-alert">
    <circle cx="120" cy="40" r="11"/>
    <path d="M120 33 V42"/><circle cx="120" cy="46.5" r="1.6" class="dot"/>
  </g>
  <g class="fx fx-hearts">
    <path class="h1" d="M118 46 c-4 -5 -11 -1 -7 5 l7 7 7 -7 c4 -6 -3 -10 -7 -5 Z"/>
    <path class="h2" d="M38 52 c-3 -4 -8 -1 -5 4 l5 5 5 -5 c3 -5 -2 -8 -5 -4 Z"/>
  </g>
  <g class="fx fx-sweat">
    <path d="M114 62 q-5 8 0 11 q5 -3 0 -11 Z"/>
  </g>
</svg>
